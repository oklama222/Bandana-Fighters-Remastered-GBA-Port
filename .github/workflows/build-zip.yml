name: Build GBA ROM (zip)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          apt-get update -qq && apt-get install -y -qq unzip
          unzip -q -o bandana.zip -d pkg
      - name: Build ROM
        run: make -C pkg/bandana-gba
      - uses: actions/upload-artifact@v4
        with:
          name: BandanaFightersGBA
          path: pkg/bandana-gba/build/BandanaFightersGBA.gba
